name: Feature idea
description: Suggest something that would make Tasply better
labels: ["idea"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation or problem. What's hard or missing today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could Tasply help?
      description: Your idea for how it could work. Rough sketches are welcome.
    validations:
      required: false
